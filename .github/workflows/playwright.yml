
name: Playwright Smoke Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  smoke-tests:
    name: Run Playwright Smoke Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      # Download the repository
      - name: Checkout repository
        uses: actions/checkout@v5

      # Install Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'

      # Install project dependencies
      - name: Install dependencies
        run: npm ci

      # Install Chromium browser and required Linux dependencies
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      # Validate TypeScript
      - name: TypeScript validation
        run: npx tsc --noEmit

      # Execute smoke tests in Chromium
      - name: Run smoke tests
        run: npx playwright test --grep @smoke --project=chromium --project=api --workers=2

      # Upload HTML report even when tests fail
      - name: Upload Playwright HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
          if-no-files-found: ignore

      # Upload test results, including traces and screenshots
      - name: Upload test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results
          path: test-results/
          retention-days: 7
          if-no-files-found: ignore